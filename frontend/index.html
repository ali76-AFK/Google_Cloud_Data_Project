<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampaignPulse</title>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; color: #111827; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
      .muted { color: #6b7280; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
      button { cursor: pointer; border: 0; background: #0f766e; color: white; padding: 10px 14px; border-radius: 10px; }
      pre { overflow: auto; background: #111827; color: #f9fafb; padding: 12px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
